<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1560" viewBox="0 0 2200 1560" role="img" aria-labelledby="title desc">
  <title id="title">Krishi Bazaar architecture overview</title>
  <desc id="desc">Board-style architecture diagram for Krishi Bazaar covering frontend, backend, database, and page-to-data mapping.</desc>
  <defs>
    <style>
      .bg { fill: #eefbef; }
      .panel { fill: #ffffff; stroke: #c9ebcf; stroke-width: 2; rx: 28; ry: 28; }
      .panelSoft { fill: #f8fff8; stroke: #c9ebcf; stroke-width: 2; rx: 22; ry: 22; }
      .pill { fill: #dff5e2; stroke: #7dd78a; stroke-width: 1.5; rx: 16; ry: 16; }
      .accent { fill: #1d652d; }
      .title { font: 800 40px 'Arial', sans-serif; fill: #173322; }
      .subtitle { font: 500 18px 'Arial', sans-serif; fill: #47614d; }
      .section { font: 800 28px 'Arial', sans-serif; fill: #1d652d; }
      .mini { font: 700 18px 'Arial', sans-serif; fill: #1d652d; }
      .body { font: 500 17px 'Arial', sans-serif; fill: #32463a; }
      .small { font: 500 15px 'Arial', sans-serif; fill: #5b7162; }
      .arrow { stroke: #4fc15f; stroke-width: 4; fill: none; marker-end: url(#arrowHead); }
      .rule { stroke: #d7f0db; stroke-width: 2; }
    </style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#4fc15f" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="2200" height="1560" />

  <rect class="panel" x="40" y="36" width="2120" height="120" />
  <text class="title" x="80" y="92">Krishi Bazaar: Project Architecture TL;DR Board</text>
  <text class="subtitle" x="80" y="128">Next.js 14 + React + Tailwind + NextAuth + MongoDB/Mongoose + optional Express backend</text>

  <rect class="pill" x="1260" y="72" width="180" height="38" />
  <text class="mini" x="1298" y="98">Frontend</text>
  <rect class="pill" x="1460" y="72" width="180" height="38" />
  <text class="mini" x="1501" y="98">Backend</text>
  <rect class="pill" x="1660" y="72" width="180" height="38" />
  <text class="mini" x="1710" y="98">Database</text>
  <rect class="pill" x="1860" y="72" width="240" height="38" />
  <text class="mini" x="1913" y="98">Page Data Mapping</text>

  <rect class="panel" x="40" y="190" width="500" height="1220" />
  <text class="section" x="72" y="242">1. Frontend Structure</text>
  <rect class="panelSoft" x="70" y="270" width="440" height="180" />
  <text class="mini" x="94" y="308">Main folders</text>
  <text class="body" x="94" y="340">- app/: pages, layouts, route handlers</text>
  <text class="body" x="94" y="370">- components/: reusable UI blocks</text>
  <text class="body" x="94" y="400">- hooks/: Zustand stores, i18n, helpers</text>
  <text class="body" x="94" y="430">- context/: language/session-related context</text>

  <rect class="panelSoft" x="70" y="474" width="440" height="248" />
  <text class="mini" x="94" y="512">Top-level pages</text>
  <text class="body" x="94" y="544">- /</text>
  <text class="body" x="94" y="574">- /login</text>
  <text class="body" x="94" y="604">- /products</text>
  <text class="body" x="94" y="634">- /products/[slug]</text>
  <text class="body" x="94" y="664">- /cart, /checkout, /orders, /account</text>
  <text class="body" x="94" y="694">- /farmer/dashboard, /admin</text>

  <text class="body" x="294" y="544">- /auctions</text>
  <text class="body" x="294" y="574">- /auctions/[id]</text>
  <text class="body" x="294" y="604">- /sell-on-greencart</text>
  <text class="body" x="294" y="634">- /bulk-order-enquiry</text>
  <text class="body" x="294" y="664">- /contact-us</text>

  <rect class="panelSoft" x="70" y="746" width="440" height="238" />
  <text class="mini" x="94" y="784">Important UI components</text>
  <text class="body" x="94" y="816">- layout/navbar.tsx</text>
  <text class="body" x="94" y="846">- layout/footer.tsx</text>
  <text class="body" x="94" y="876">- home/hero-slideshow.tsx</text>
  <text class="body" x="94" y="906">- home/mandi-rates-panel.tsx</text>
  <text class="body" x="94" y="936">- products/product-card.tsx</text>
  <text class="body" x="94" y="966">- auctions/auction-card.tsx</text>

  <rect class="panelSoft" x="70" y="1008" width="440" height="178" />
  <text class="mini" x="94" y="1046">Client-side state</text>
  <text class="body" x="94" y="1078">- use-cart-store.ts</text>
  <text class="body" x="94" y="1108">- use-wishlist-store.ts</text>
  <text class="body" x="94" y="1138">- use-order-store.ts</text>
  <text class="body" x="94" y="1168">- use-i18n.ts + LanguageProvider</text>

  <rect class="panelSoft" x="70" y="1210" width="440" height="166" />
  <text class="mini" x="94" y="1248">Frontend mental model</text>
  <text class="body" x="94" y="1280">UI pages call /api/* routes.</text>
  <text class="body" x="94" y="1310">Most shared rendering logic lives in components/.</text>
  <text class="body" x="94" y="1340">Global look-and-feel is in globals.css and Tailwind config.</text>

  <rect class="panel" x="570" y="190" width="500" height="1220" />
  <text class="section" x="602" y="242">2. Backend Structure</text>
  <rect class="panelSoft" x="600" y="270" width="440" height="190" />
  <text class="mini" x="624" y="308">Primary backend style</text>
  <text class="body" x="624" y="340">Next.js Route Handlers inside app/api/*</text>
  <text class="body" x="624" y="370">Examples:</text>
  <text class="body" x="624" y="400">- /api/products</text>
  <text class="body" x="624" y="430">- /api/orders</text>
  <text class="body" x="624" y="460">- /api/users/register</text>

  <rect class="panelSoft" x="600" y="486" width="440" height="210" />
  <text class="mini" x="624" y="524">Service layer</text>
  <text class="body" x="624" y="556">- services/catalog.ts</text>
  <text class="body" x="624" y="586">- services/dashboard.ts</text>
  <text class="body" x="624" y="616">- services/orders.ts</text>
  <text class="body" x="624" y="646">- services/auctions.ts</text>
  <text class="body" x="624" y="676">- services/seed.ts</text>

  <rect class="panelSoft" x="600" y="720" width="440" height="272" />
  <text class="mini" x="624" y="758">Main API groups</text>
  <text class="body" x="624" y="790">Catalog:</text>
  <text class="body" x="754" y="790">/api/products, /api/search</text>
  <text class="body" x="624" y="820">Auth/User:</text>
  <text class="body" x="754" y="820">/api/auth, /api/users/register</text>
  <text class="body" x="624" y="850">Orders:</text>
  <text class="body" x="754" y="850">/api/orders</text>
  <text class="body" x="624" y="880">Farmer:</text>
  <text class="body" x="754" y="880">/api/farmer/products</text>
  <text class="body" x="624" y="910">Auctions:</text>
  <text class="body" x="754" y="910">/api/auctions, /api/auctions/[id]/bids</text>
  <text class="body" x="624" y="940">Utility:</text>
  <text class="body" x="754" y="940">/api/market, /api/weather, /api/enquiries</text>

  <rect class="panelSoft" x="600" y="1016" width="440" height="164" />
  <text class="mini" x="624" y="1054">Auth</text>
  <text class="body" x="624" y="1086">NextAuth credentials login in lib/auth.ts</text>
  <text class="body" x="624" y="1116">Session carries id, role, farmerId.</text>
  <text class="body" x="624" y="1146">Used to allow farmer-only and buyer-only actions.</text>

  <rect class="panelSoft" x="600" y="1204" width="440" height="172" />
  <text class="mini" x="624" y="1242">Optional Express backend</text>
  <text class="body" x="624" y="1274">api/server.ts exposes standalone endpoints.</text>
  <text class="body" x="624" y="1304">It reuses shared service logic.</text>
  <text class="body" x="624" y="1334">Good for external backend testing or future split.</text>

  <rect class="panel" x="1100" y="190" width="500" height="1220" />
  <text class="section" x="1132" y="242">3. Database / MongoDB</text>
  <rect class="panelSoft" x="1130" y="270" width="440" height="148" />
  <text class="mini" x="1154" y="308">Connection</text>
  <text class="body" x="1154" y="340">- MongoDB + Mongoose</text>
  <text class="body" x="1154" y="370">- lib/db.ts manages cached connection</text>
  <text class="body" x="1154" y="400">- Current db name: greencart</text>

  <rect class="panelSoft" x="1130" y="442" width="440" height="388" />
  <text class="mini" x="1154" y="480">Core collections</text>
  <text class="body" x="1154" y="512">- User</text>
  <text class="body" x="1154" y="542">- Farmer</text>
  <text class="body" x="1154" y="572">- Category</text>
  <text class="body" x="1154" y="602">- Product</text>
  <text class="body" x="1154" y="632">- Order</text>
  <text class="body" x="1154" y="662">- Review</text>
  <text class="body" x="1154" y="692">- Inquiry</text>
  <text class="body" x="1154" y="722">- Auction</text>
  <text class="body" x="1154" y="752">- Bid</text>
  <text class="body" x="1298" y="512">Future/support models:</text>
  <text class="body" x="1298" y="542">- Cart</text>
  <text class="body" x="1298" y="572">- Wishlist</text>
  <text class="body" x="1298" y="602">- Address</text>
  <text class="body" x="1298" y="632">- Analytics</text>

  <rect class="panelSoft" x="1130" y="854" width="440" height="254" />
  <text class="mini" x="1154" y="892">Key relationships</text>
  <text class="body" x="1154" y="924">User 1 -> 0/1 Farmer</text>
  <text class="body" x="1154" y="954">Farmer 1 -> many Products</text>
  <text class="body" x="1154" y="984">User 1 -> many Orders</text>
  <text class="body" x="1154" y="1014">Auction 1 -> many Bids</text>
  <text class="body" x="1154" y="1044">User buyer/admin -> many Bids</text>
  <text class="body" x="1154" y="1074">Inquiry is independent by form type</text>

  <rect class="panelSoft" x="1130" y="1132" width="440" height="244" />
  <text class="mini" x="1154" y="1170">Data mode behavior</text>
  <text class="body" x="1154" y="1202">If Mongo is configured:</text>
  <text class="body" x="1180" y="1232">reads and writes use Mongoose models</text>
  <text class="body" x="1154" y="1262">If Mongo is missing:</text>
  <text class="body" x="1180" y="1292">many screens fall back to mock data</text>
  <text class="body" x="1180" y="1322">write-heavy features can return config errors</text>

  <rect class="panel" x="1630" y="190" width="530" height="1220" />
  <text class="section" x="1662" y="242">4. Page -> Data Map</text>
  <rect class="panelSoft" x="1660" y="270" width="470" height="208" />
  <text class="mini" x="1684" y="308">Home</text>
  <text class="body" x="1684" y="340">/ uses:</text>
  <text class="body" x="1770" y="340">categories, featured products, trending products,</text>
  <text class="body" x="1770" y="370">farmers, mandi rates, weather insights</text>
  <text class="small" x="1684" y="414">Models/services: Category, Product, Farmer, dashboard.ts, datagov.ts</text>

  <rect class="panelSoft" x="1660" y="500" width="470" height="170" />
  <text class="mini" x="1684" y="538">Login / Account</text>
  <text class="body" x="1684" y="570">/login -> User + Farmer registration, NextAuth login</text>
  <text class="body" x="1684" y="600">/account -> User profile, wishlist, quick links</text>
  <text class="small" x="1684" y="636">Models/services: User, Farmer, auth.ts</text>

  <rect class="panelSoft" x="1660" y="692" width="470" height="192" />
  <text class="mini" x="1684" y="730">Catalog / Commerce</text>
  <text class="body" x="1684" y="762">/products -> Product list + category/state filters</text>
  <text class="body" x="1684" y="792">/products/[slug] -> Product detail + Farmer + Review</text>
  <text class="body" x="1684" y="822">/cart /checkout /orders -> Product + Order + client cart state</text>
  <text class="small" x="1684" y="858">Models/services: Product, Farmer, Review, Order, orders.ts</text>

  <rect class="panelSoft" x="1660" y="906" width="470" height="208" />
  <text class="mini" x="1684" y="944">Farmer / Admin</text>
  <text class="body" x="1684" y="976">/farmer/dashboard -> farmer products + seller auctions + metrics</text>
  <text class="body" x="1684" y="1006">/admin -> overview, products, farmers, highlights</text>
  <text class="small" x="1684" y="1050">Models/services: Product, Auction, Farmer, dashboard.ts</text>

  <rect class="panelSoft" x="1660" y="1136" width="470" height="170" />
  <text class="mini" x="1684" y="1174">Auctions / Enquiries</text>
  <text class="body" x="1684" y="1206">/auctions -> active auctions</text>
  <text class="body" x="1684" y="1236">/auctions/[id] -> auction detail + bid history + bid form</text>
  <text class="body" x="1684" y="1266">seller/bulk/contact pages -> Inquiry submissions</text>

  <path class="arrow" d="M520 800 C 545 800, 555 800, 590 800" />
  <path class="arrow" d="M1050 800 C 1075 800, 1085 800, 1120 800" />
  <path class="arrow" d="M1580 800 C 1605 800, 1615 800, 1650 800" />

  <rect class="panel" x="40" y="1430" width="2120" height="92" />
  <text class="mini" x="74" y="1470">Recommended reading order</text>
  <text class="body" x="74" y="1500">PROJECT_TLDR.md -> app/layout.tsx -> app/page.tsx -> components/layout/navbar.tsx -> lib/services/catalog.ts -> lib/services/auctions.ts -> lib/auth.ts -> models/Product.ts -> models/User.ts -> models/Auction.ts</text>
</svg>
